apply plugin: 'com.android.application'

/* Número de versión (NUEVO21): el número de corrida de GitHub Actions,
   para que cada APK sea una actualización de la anterior. Se calcula
   AQUÍ, fuera del bloque android, con asignación directa (versionCode =)
   en vez de la forma corta de Gradle, porque la expresión con getenv
   dentro de defaultConfig hacía fallar la evaluación del proyecto
   ("Value is null" en la corrida #36). Sin número de corrida (build
   local), queda versionCode 1 / versionName 1.0. */
def gurruRunNumber = System.getenv("GITHUB_RUN_NUMBER")
def gurruVersionCode = 1
def gurruVersionName = "1.0"
if (gurruRunNumber != null && (gurruRunNumber ==~ /\d+/)) {
    gurruVersionCode = gurruRunNumber.toInteger()
    gurruVersionName = "1.0." + gurruRunNumber
}

android {
    namespace "com.gurru.music"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gurru.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = gurruVersionCode
        versionName = gurruVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // yt-dlp + FFmpeg llegan como .so nativos dentro de los AAR: se guardan
    // sin comprimir para que el sistema los extraiga al instalar
    // (junto con android:extractNativeLibs="true" en el Manifest).
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Descargas nativas con yt-dlp dentro del APK (youtubedl-android 0.17.x,
    // fork JunkFood02: empaqueta CPython + yt-dlp + FFmpeg como .so nativos).
    // 0.17.x es la serie verificada (Python 3.11.10 en 0.17.1); existe 0.18.x
    // pero no se adopta en este paso. La descarga de los binarios en runtime
    // NO es para Google Play: esta app se distribuye por sideload / GitHub.
    implementation "io.github.junkfood02.youtubedl-android:library:0.17.+"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.17.+"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
