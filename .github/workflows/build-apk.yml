# Gurru Music — compila el APK en la nube con GitHub Actions
# Uso desde el celular: sube este proyecto a un repo privado de GitHub,
# ve a Actions > Build APK > Run workflow, y descarga app-release.apk.
# No necesita Node.js ni Android Studio en tu computadora ni en tu teléfono.
# La firma release usa la llave de los secretos de GitHub (KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD): cada APK sale con la misma
# llave y se instala como actualización encima del anterior.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar la app web con Android
        run: npx cap sync

      - name: Preparar la llave de firma (release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Falta el secreto KEYSTORE_BASE64 en GitHub (repo → Settings → Secrets and variables → Actions). Agrégalo con la llave de Gurru Music (ver LEEME-LLAVE-DE-FIRMA.txt) y vuelve a correr el workflow."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/gurru-release.keystore

      - name: Diagnosticar la llave de firma (temporal)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "base64 len: ${#KEYSTORE_BASE64}"
          echo "alias len: ${#KEY_ALIAS}"
          echo "store pass len: ${#KEYSTORE_PASSWORD}"
          echo "key pass len: ${#KEY_PASSWORD}"
          ls -l /tmp/gurru-release.keystore
          md5sum /tmp/gurru-release.keystore
          keytool -list -keystore /tmp/gurru-release.keystore -storepass "$KEYSTORE_PASSWORD" || echo "LIST FALLO"
          keytool -list -keystore /tmp/gurru-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" || echo "ALIAS NO EXISTE"

      - name: Compilar el APK (release, firmado con la llave estable)
        env:
          KEYSTORE_PATH: /tmp/gurru-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: gurru-music-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
